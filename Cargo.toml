[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/core",
    "crates/storage",
    "crates/crypto",
    "crates/sync-protocol",
    "crates/sync-client",
    "crates/ui",
    "crates/mobile-ffi",
]
default-members = ["apps/desktop"]
# Vendored third-party code: built as a dependency, not linted as ours.
exclude = ["vendor"]

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
publish = false
authors = ["Mohammed Safwan"]

[workspace.dependencies]
# Internal crates
ottero-core = { path = "crates/core" }
ottero-storage = { path = "crates/storage" }
ottero-crypto = { path = "crates/crypto" }
ottero-sync-protocol = { path = "crates/sync-protocol" }
ottero-sync-client = { path = "crates/sync-client" }
ottero-ui = { path = "crates/ui" }

# UI. gpui-kit re-exports a pinned GPUI snapshot (gpui-pre). Never add `gpui` directly.
gpui-kit = { version = "0.9.0", features = ["syntect"] }
# Note editor (Obsidian-style live preview) and its LaTeX renderer. Both depend on
# `gpui-pre` directly, so they are pinned exactly and must resolve to the SAME
# gpui-pre as gpui-kit (`cargo tree -d -i gpui-pre` shows one). See ADR 0004.
zorite-editor = "=0.11.3"
ratex-gpui = { version = "=0.4.1", default-features = false }
# Code-block colors in notes: the same syntect + two-face versions gpui-kit's
# `syntect` feature uses (one copy in the tree), ~200 languages, no tree-sitter.
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
# Spell-check in notes through the OS checker (NSSpellChecker / ISpellChecker),
# a no-op on Linux. MIT, same author as zorite-editor.
os-spellcheck = "=0.2.1"
# ```mermaid diagrams in notes: pure Rust → SVG (MIT), the renderer Zed's
# Markdown preview uses. Not on crates.io; pinned to Zed's known-good revision.
# Rasterized with GPUI's own SVG renderer (no resvg copy: default features off).
mermaid-rs-renderer = { git = "https://github.com/zed-industries/mermaid-rs-renderer", rev = "782b89a7da3f0e91e51f98d00a93acba679be6fb", default-features = false }

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1.29", features = ["v7", "serde"] }
jiff = { version = "0.2.40", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"

# Same version as gpui-kit's DatePicker uses.
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Storage
# Pinned to 0.40 because rusqlite_migration 2.6 depends on it (only one libsqlite3-sys may link).
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rusqlite_migration = "2.6"

# Crypto
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }
secrecy = "0.10"
getrandom = "0.4"
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth", "zeroize"] }
zxcvbn = { version = "3.1", default-features = false }
csv = "1.4"
# Ottero Cloud account keys (ADR 0011): HKDF-SHA256, NFKC passwords, base64url wire format.
hkdf = "0.12"
unicode-normalization = "0.1"
base64 = "0.22"

# Updates: minisign signatures on the update feed, SHA-256 of downloads,
# a small blocking HTTPS client (rustls, no OpenSSL).
minisign-verify = "0.2"
sha2 = "0.10"
async-channel = "2"
velopack = { version = "=1.2.161", features = ["public-utils"] }
# Windows Credential Manager for the Ottero Cloud sign-in (ADR 0012).
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# QR code for turning on two-step verification (ADR 0013). No image/SVG features: modules only.
qrcode = { version = "0.14", default-features = false }

# Mobile FFI (Kotlin/Android & Swift/iOS via Mozilla UniFFI)
uniffi = "0.29"

# Dev
tempfile = "3"

# Ottero's patched copy of zorite-editor (ADR 0004, vendor/zorite-editor/PATCHES.md).
[patch.crates-io]
zorite-editor = { path = "vendor/zorite-editor" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

# GPUI is slow in plain debug builds. Optimise the framework, keep our crates debuggable.
# Disk: full debug info on ~600 dependencies was most of a 60 GB target
# folder. Our crates keep line tables (panics and backtraces still show
# file:line); dependencies get none. Run scripts/clean-build.sh weekly.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.ottero-desktop]
opt-level = 0

# CI quality gate (scripts/check.sh with OTTERO_CHECK_PROFILE=ci): no
# optimisation and no debug info, so a cold build takes about 40% of the time
# the dev profile needs. Tests don't need the dev profile's optimised GPUI.
[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 0
debug = false

# Release speed with symbols, for profiling (scripts/perf.sh, `sample`).
[profile.perf]
inherits = "release"
strip = false
debug = "line-tables-only"
panic = "unwind"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
