name: Release candidate
# Produces a complete, verified candidate. Publication to the separate public
# artifacts repository is a final draft-to-published operation by the owner/agent.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Workspace version to build (for example 0.1.2)'
        required: true
# Never interrupt an installation/signing candidate with a second dispatch.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  engines:
    uses: ./.github/workflows/update-probes.yml
  # A tag on a commit whose CI already passed on both systems doesn't run
  # the same 15-20 minute quality gate again; any other commit does.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    outputs:
      verified: ${{ steps.ci.outputs.verified }}
    steps:
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          ok=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select((.name == "check (macos-latest)" or .name == "check (windows-latest)") and .conclusion == "success") | .name] | unique | length')
          if [ "$ok" = "2" ]; then echo "verified=true" >> "$GITHUB_OUTPUT"; echo "CI passed on $SHA; skipping the repeat quality gate"; else echo "verified=false" >> "$GITHUB_OUTPUT"; fi
  quality:
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: samypr100/setup-dev-drive@v4
        if: runner.os == 'Windows'
        with:
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          cache-on-failure: true
          workspaces: ". -> ${{ env.CARGO_TARGET_DIR || 'target' }}"
      - shell: bash
        env:
          OTTERO_CHECK_PROFILE: ci
        run: scripts/check.sh
  build:
    env:
      OTTERO_SPARKLE_DIR: ${{ github.workspace }}/.native-tools/sparkle
    # Do not spend time packaging a candidate whose quality/native gates failed
    # (quality is skipped, not failed, when CI already verified this commit).
    needs: [engines, quality]
    if: ${{ !cancelled() && needs.engines.result == 'success' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: Swatinem/rust-cache@v2
        with: {key: release}
      - name: Validate requested version against source
        shell: bash
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re,tomllib
          version=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert os.environ['REQUESTED'].removeprefix('v') == version, 'source/version mismatch'
          with open(os.environ['GITHUB_ENV'],'a') as file: file.write('VERSION='+version+'\n')
          PY
      - name: Build Mac native bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/bundle-mac.sh
          mkdir -p dist
          ditto -c -k --keepParent target/release/Ottero.app "dist/Ottero-${VERSION}-macos-arm64.zip"
      - name: Sign and verify Sparkle archive and appcast
        if: runner.os == 'macOS'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'sparkle.key'
          try:
              key.write_text(os.environ['SPARKLE_KEY']); key.chmod(0o600)
              subprocess.run(['python3','scripts/sign-appcast.py',os.environ['VERSION'],'dist',str(key)],check=True)
          finally: key.unlink(missing_ok=True)
          PY
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with: {dotnet-version: '8.0.x'}
      - name: Build Windows native packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release -p ottero-desktop --bin ottero
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install --tool-path "$env:RUNNER_TEMP/vpk" vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/release-payload | Out-Null
          Copy-Item target/release/ottero.exe target/release-payload/Ottero.exe
          Copy-Item LICENSE,NOTICE target/release-payload/
          python scripts/release-source.py target/release-payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/third-party-notices.py target/release-payload/THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/vpk/vpk.exe" pack --packId Calmfold --packTitle Ottero --packVersion $env:VERSION --packDir target/release-payload --mainExe Ottero.exe --outputDir dist --channel win --runtime win-x64 --icon assets/brand/ottero.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # packId stays Calmfold (installed apps' identity, ADR 0009); only the
          # downloaded installer file names carry the product name.
          Rename-Item dist/Calmfold-win-Setup.exe Ottero-win-Setup.exe -ErrorAction Stop
          Rename-Item dist/Calmfold-win-Portable.zip Ottero-win-Portable.zip -ErrorAction Stop
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          retention-days: 3
          path: |
            dist/*.zip
            dist/*.exe
            dist/*-full.nupkg
            dist/appcast.xml
          if-no-files-found: error
  android:
    needs: [engines, quality]
    if: ${{ !cancelled() && needs.engines.result == 'success' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@v2
        with: {key: release-android}
      - name: Validate version and install Android Rust targets
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2 || true
      - name: Build Android Rust FFI and release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          ./scripts/build-android-rust.sh --release
          (cd apps/android && ./gradlew assembleRelease)
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk "dist/Ottero-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: native-Android
          retention-days: 3
          path: dist/*.apk
          if-no-files-found: error
  catalog:
    needs: [engines, quality, build, android]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign and verify complete catalog
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess,tomllib
          version=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'minisign.key'
          try:
              key.write_text(os.environ['MINISIGN_KEY']); key.chmod(0o600)
              subprocess.run(['scripts/make-feed.sh',version,'dist',str(key)],check=True)
          finally: key.unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          retention-days: 7
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [catalog]
    if: ${{ !cancelled() && needs.catalog.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish to calmfold-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: MohammedSafwan10/calmfold-releases
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RELEASES_TOKEN secret is not set; skipping automatic publication to $RELEASES_REPO."
            exit 0
          fi
      - uses: actions/checkout@v4
        if: ${{ env.GH_TOKEN != '' || true }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: release-dist
      - name: Package source archive, checksums, and publish atomically
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: MohammedSafwan10/calmfold-releases
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            exit 0
          fi
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          TAG="v${VERSION}"
          cp LICENSE NOTICE release-dist/
          git archive --format=tar.gz --prefix="ottero-${VERSION}/" HEAD -o "release-dist/Ottero-${VERSION}-source.tar.gz"
          (cd release-dist && sha256sum appcast.xml "Calmfold-${VERSION}-full.nupkg" LICENSE NOTICE "Ottero-${VERSION}-android.apk" "Ottero-${VERSION}-macos-arm64.zip" "Ottero-${VERSION}-source.tar.gz" Ottero-win-Portable.zip Ottero-win-Setup.exe stable.json stable.json.minisig > SHA256SUMS)
          python3 - "$VERSION" "$SHA" "$RUN_ID" "$RELEASES_REPO" > /tmp/release-notes.md <<'PY'
          import json, sys
          version, sha, run_id, repo = sys.argv[1:5]
          tag = f"v{version}"
          entries = json.load(open("apps/desktop/changelog.json", encoding="utf-8"))
          entry = next((e for e in entries if e["version"] == version), None)
          lines = []
          if entry:
              lines.append(f"## {entry['title']}\n")
              lines.append(f"{entry['summary']}\n")
              for sec in entry.get("sections", []):
                  lines.append(f"## {sec['title']}\n")
                  for item in sec.get("items", []):
                      lines.append(f"- {item}")
                  lines.append("")
          base = f"https://github.com/{repo}/releases/download/{tag}"
          lines += [
              "## Download\n",
              f"- [Mac · Apple Silicon]({base}/Ottero-{version}-macos-arm64.zip)",
              f"- [Windows · x64 installer]({base}/Ottero-win-Setup.exe)",
              f"- [Windows · portable]({base}/Ottero-win-Portable.zip)",
              f"- [Android · APK]({base}/Ottero-{version}-android.apk)",
              f"- [Application source · GPLv3]({base}/Ottero-{version}-source.tar.gz)\n",
              "Or go to [ottero.nexdark.com](https://ottero.nexdark.com).\n",
              f"Already using Ottero? **Settings → About → Check now** downloads and installs `{version}` automatically.\n",
              "Publisher signing: these builds are not yet Apple-notarized or Windows Authenticode-signed, so the OS may warn on first installation. Update signatures are verified separately (`stable.json.minisig`, Sparkle EdDSA for the Mac appcast).\n",
              "## Source\n",
              "Ottero is GPL-3.0-only. License, dependency notices and the exact source location are included in both platform packages.\n",
              f"[Exact build source](https://github.com/MohammedSafwan10/ottero/tree/{sha}) · [Verification run](https://github.com/MohammedSafwan10/ottero/actions/runs/{run_id})\n",
              "Personal data stays local. No account is required.",
          ]
          print("\n".join(lines))
          PY
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists in $RELEASES_REPO; refusing to overwrite."
            exit 0
          fi
          gh release create "$TAG" --repo "$RELEASES_REPO" --draft --title "Ottero $TAG" --notes-file /tmp/release-notes.md release-dist/*
          gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false --latest
