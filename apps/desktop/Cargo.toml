[package]
name = "ottero-desktop"
description = "Ottero desktop app (GPUI shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ottero_desktop"
path = "src/lib.rs"

[[bin]]
name = "ottero"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
tempfile.workspace = true
ottero-core.workspace = true
ottero-storage.workspace = true
ottero-ui.workspace = true
ottero-crypto.workspace = true
ottero-sync-protocol.workspace = true
gpui-kit.workspace = true
zorite-editor.workspace = true
ratex-gpui.workspace = true
syntect.workspace = true
two-face.workspace = true
mermaid-rs-renderer.workspace = true
os-spellcheck.workspace = true
anyhow.workspace = true
thiserror.workspace = true
ureq.workspace = true
async-channel.workspace = true
directories.workspace = true
jiff.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
qrcode.workspace = true

[target.'cfg(windows)'.dependencies]
velopack.workspace = true
keyring-core.workspace = true
windows-native-keyring-store.workspace = true

[features]
# Frame/input-latency recording for scripts/perf.sh. Never in shipped builds.
perf = ["gpui-kit/profiler"]

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# Cheap Argon2 for the account UI tests (test builds only).
ottero-crypto = { workspace = true, features = ["insecure-test-kdf"] }
tempfile.workspace = true

[lints]
workspace = true
